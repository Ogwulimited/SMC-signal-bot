name: HistData Pipeline (28 Pairs - Expansion)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 7 pairs, report NOT committed; full = all 28 pairs, report committed"
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.pick.outputs.pairs }}
      pairs_csv: ${{ steps.pick.outputs.pairs_csv }}
    steps:
      - name: Pick pair list
        id: pick
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "full" ]; then
            CSV="eurusd,gbpusd,usdjpy,audusd,usdcad,usdchf,nzdusd,eurjpy,gbpjpy,eurgbp,audjpy,eurchf,eurcad,euraud,eurnzd,gbpchf,gbpcad,gbpaud,gbpnzd,audcad,audchf,audnzd,nzdjpy,nzdcad,nzdchf,cadjpy,cadchf,chfjpy"
          else
            CSV="eurusd,usdjpy,eurgbp,gbpjpy,eurchf,audcad,eurnzd"
          fi
          echo "pairs_csv=$CSV" >> "$GITHUB_OUTPUT"
          echo "pairs=$(echo "$CSV" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  download:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install histdata pandas pyarrow requests

      - name: Restore raw cache ${{ matrix.pair }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: histdata-raw-${{ matrix.pair }}-v1
          restore-keys: histdata-raw-${{ matrix.pair }}-

      - name: Download ${{ matrix.pair }}
        env: { PAIR: "${{ matrix.pair }}", TEST_MODE: "false" }
        run: python scripts/download_histdata.py

      - name: Save raw cache ${{ matrix.pair }}
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: histdata-raw-${{ matrix.pair }}-v1-${{ github.run_id }}

  build:
    needs: [plan, download]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas pyarrow

      - name: Restore raw cache ${{ matrix.pair }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: histdata-raw-${{ matrix.pair }}-v1-${{ github.run_id }}
          restore-keys: histdata-raw-${{ matrix.pair }}-v1-

      - name: Build ${{ matrix.pair }}
        env: { PAIR: "${{ matrix.pair }}" }
        run: python -m src.data.build_history

      - name: Save processed cache ${{ matrix.pair }}
        uses: actions/cache/save@v4
        with:
          path: data/processed
          key: histdata-processed-${{ matrix.pair }}-${{ github.run_id }}

  test_and_report:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas pyarrow pytest

      - name: Restore eurusd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurusd-${{ github.run_id }}", restore-keys: histdata-processed-eurusd- }
      - name: Restore gbpusd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpusd-${{ github.run_id }}", restore-keys: histdata-processed-gbpusd- }
      - name: Restore usdjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-usdjpy-${{ github.run_id }}", restore-keys: histdata-processed-usdjpy- }
      - name: Restore audusd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-audusd-${{ github.run_id }}", restore-keys: histdata-processed-audusd- }
      - name: Restore usdcad
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-usdcad-${{ github.run_id }}", restore-keys: histdata-processed-usdcad- }
      - name: Restore usdchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-usdchf-${{ github.run_id }}", restore-keys: histdata-processed-usdchf- }
      - name: Restore nzdusd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-nzdusd-${{ github.run_id }}", restore-keys: histdata-processed-nzdusd- }
      - name: Restore eurjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurjpy-${{ github.run_id }}", restore-keys: histdata-processed-eurjpy- }
      - name: Restore gbpjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpjpy-${{ github.run_id }}", restore-keys: histdata-processed-gbpjpy- }
      - name: Restore eurgbp
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurgbp-${{ github.run_id }}", restore-keys: histdata-processed-eurgbp- }
      - name: Restore audjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-audjpy-${{ github.run_id }}", restore-keys: histdata-processed-audjpy- }
      - name: Restore eurchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurchf-${{ github.run_id }}", restore-keys: histdata-processed-eurchf- }
      - name: Restore eurcad
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurcad-${{ github.run_id }}", restore-keys: histdata-processed-eurcad- }
      - name: Restore euraud
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-euraud-${{ github.run_id }}", restore-keys: histdata-processed-euraud- }
      - name: Restore eurnzd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-eurnzd-${{ github.run_id }}", restore-keys: histdata-processed-eurnzd- }
      - name: Restore gbpchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpchf-${{ github.run_id }}", restore-keys: histdata-processed-gbpchf- }
      - name: Restore gbpcad
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpcad-${{ github.run_id }}", restore-keys: histdata-processed-gbpcad- }
      - name: Restore gbpaud
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpaud-${{ github.run_id }}", restore-keys: histdata-processed-gbpaud- }
      - name: Restore gbpnzd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-gbpnzd-${{ github.run_id }}", restore-keys: histdata-processed-gbpnzd- }
      - name: Restore audcad
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-audcad-${{ github.run_id }}", restore-keys: histdata-processed-audcad- }
      - name: Restore audchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-audchf-${{ github.run_id }}", restore-keys: histdata-processed-audchf- }
      - name: Restore audnzd
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-audnzd-${{ github.run_id }}", restore-keys: histdata-processed-audnzd- }
      - name: Restore nzdjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-nzdjpy-${{ github.run_id }}", restore-keys: histdata-processed-nzdjpy- }
      - name: Restore nzdcad
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-nzdcad-${{ github.run_id }}", restore-keys: histdata-processed-nzdcad- }
      - name: Restore nzdchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-nzdchf-${{ github.run_id }}", restore-keys: histdata-processed-nzdchf- }
      - name: Restore cadjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-cadjpy-${{ github.run_id }}", restore-keys: histdata-processed-cadjpy- }
      - name: Restore cadchf
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-cadchf-${{ github.run_id }}", restore-keys: histdata-processed-cadchf- }
      - name: Restore chfjpy
        uses: actions/cache/restore@v4
        with: { path: data/processed, key: "histdata-processed-chfjpy-${{ github.run_id }}", restore-keys: histdata-processed-chfjpy- }

      - name: Aggregate Report
        env:
          PYTHONPATH: "."
          STRICT: "true"
          PAIRS_OVERRIDE: ${{ inputs.mode != 'full' && needs.plan.outputs.pairs_csv || '' }}
        run: python scripts/aggregate_report.py

      - name: Show report
        run: cat reports/data/histdata_validation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Tests
        run: python -m pytest tests/test_data.py -v

      - name: Commit Report
        if: inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/data/histdata_validation.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update validation report [skip ci]"
          git push
