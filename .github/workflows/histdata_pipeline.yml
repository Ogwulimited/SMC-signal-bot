name: HistData Pipeline

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [eurusd, gbpusd, usdjpy, audusd, usdcad, usdchf, nzdusd, eurjpy, gbpjpy, eurgbp, audjpy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install histdata pandas pyarrow requests
      
      - name: Restore raw cache ${{ matrix.pair }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: histdata-raw-${{ matrix.pair }}-v1
          restore-keys: histdata-raw-${{ matrix.pair }}-
          
      - name: Download ${{ matrix.pair }}
        env: { PAIR: "${{ matrix.pair }}" }
        run: python scripts/download_histdata.py
        
      - name: Save raw cache ${{ matrix.pair }}
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: histdata-raw-${{ matrix.pair }}-v1-${{ github.run_id }}

  build_and_test:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas pyarrow pytest

      # Explicitly restore all 11 caches
      - name: Restore eurusd
        uses: actions/cache/restore@v4
        with: { path: data/raw/eurusd, key: "histdata-raw-eurusd-v1-${{ github.run_id }}", restore-keys: histdata-raw-eurusd-v1- }
      - name: Restore gbpusd
        uses: actions/cache/restore@v4
        with: { path: data/raw/gbpusd, key: "histdata-raw-gbpusd-v1-${{ github.run_id }}", restore-keys: histdata-raw-gbpusd-v1- }
      - name: Restore usdjpy
        uses: actions/cache/restore@v4
        with: { path: data/raw/usdjpy, key: "histdata-raw-usdjpy-v1-${{ github.run_id }}", restore-keys: histdata-raw-usdjpy-v1- }
      - name: Restore audusd
        uses: actions/cache/restore@v4
        with: { path: data/raw/audusd, key: "histdata-raw-audusd-v1-${{ github.run_id }}", restore-keys: histdata-raw-audusd-v1- }
      - name: Restore usdcad
        uses: actions/cache/restore@v4
        with: { path: data/raw/usdcad, key: "histdata-raw-usdcad-v1-${{ github.run_id }}", restore-keys: histdata-raw-usdcad-v1- }
      - name: Restore usdchf
        uses: actions/cache/restore@v4
        with: { path: data/raw/usdchf, key: "histdata-raw-usdchf-v1-${{ github.run_id }}", restore-keys: histdata-raw-usdchf-v1- }
      - name: Restore nzdusd
        uses: actions/cache/restore@v4
        with: { path: data/raw/nzdusd, key: "histdata-raw-nzdusd-v1-${{ github.run_id }}", restore-keys: histdata-raw-nzdusd-v1- }
      - name: Restore eurjpy
        uses: actions/cache/restore@v4
        with: { path: data/raw/eurjpy, key: "histdata-raw-eurjpy-v1-${{ github.run_id }}", restore-keys: histdata-raw-eurjpy-v1- }
      - name: Restore gbpjpy
        uses: actions/cache/restore@v4
        with: { path: data/raw/gbpjpy, key: "histdata-raw-gbpjpy-v1-${{ github.run_id }}", restore-keys: histdata-raw-gbpjpy-v1- }
      - name: Restore eurgbp
        uses: actions/cache/restore@v4
        with: { path: data/raw/eurgbp, key: "histdata-raw-eurgbp-v1-${{ github.run_id }}", restore-keys: histdata-raw-eurgbp-v1- }
      - name: Restore audjpy
        uses: actions/cache/restore@v4
        with: { path: data/raw/audjpy, key: "histdata-raw-audjpy-v1-${{ github.run_id }}", restore-keys: histdata-raw-audjpy-v1- }

      - name: Build Data
        run: python -m src.data.build_history

      - name: Run Tests
        run: pytest tests/test_data.py -v

      - name: Save processed cache
        uses: actions/cache/save@v4
        with:
          path: data/processed
          key: histdata-processed-v1-${{ github.run_id }}

      - name: Commit Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/data/histdata_validation.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update validation report [skip ci]"
          git push
