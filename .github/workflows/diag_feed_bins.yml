name: Diag Feed Bins 2

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Pair (lowercase)"
        required: false
        default: "eurusd"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow numpy
      - name: Restore processed data
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: histdata-processed-${{ inputs.pair }}-nomatch
          restore-keys: |
            histdata-processed-${{ inputs.pair }}-
      - name: Check data
        run: |
          ls data/processed | head -20
          test -f data/processed/${{ inputs.pair }}_m15.parquet || { echo "MISSING processed data"; exit 1; }
      - name: Run diagnostic
        env:
          PAIR: ${{ inputs.pair }}
        run: python -m src.research.engine.diag_feed
