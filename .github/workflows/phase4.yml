name: SMC Research Phase 4

on:
  workflow_dispatch:

jobs:
  test_simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow pytest
      - name: Run Phase 4 Diagnostics
        run: python -m pytest tests/diag_phase4_t1_target.py tests/diag_phase4_exit_scan.py -v -s
