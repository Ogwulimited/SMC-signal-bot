name: SMC Research Phase 2

on:
  workflow_dispatch:

jobs:
  test_zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow pytest
      - name: Run Phase 2 Breaker Diagnostic
        run: python -m pytest tests/test_zones_breakers_diagnostic.py -v -s
