name: SMC Research Phase 2

on:
  workflow_dispatch:

jobs:
  test_zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow pytest
      - name: Run Phase 2 Tests
        run: python -m pytest tests/test_zones.py tests/test_zones_htf.py tests/test_zones_inducement.py tests/test_zones_breakers.py tests/test_zones_touchfill.py tests/test_zones_pdhpdl.py tests/test_zones_equalhighs.py tests/test_zones_inducement_bearish.py tests/test_zones_breakers_bearish.py tests/test_zones_liqtaken_bearish.py tests/test_zones_touchfill_bearish.py tests/test_zones_inducement_modela_bearish.py -v -s
