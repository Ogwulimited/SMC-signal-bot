name: Phase 4 Cycle Run (practice years)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = eurusd only (correctness check); full = all 28 pairs"
        type: choice
        options: [smoke, full]
        default: smoke
      variants:
        description: "mh = rule change: trading timeframe H1 (D1+H4+H1) on top of mz; mz = Major swings + zone rules (M15); zt = v1 + zone trades; v1 = 5 sw, D1+H4; v2 = 3 sw, D1+H4; v3 = 3 sw, H4 only; v4 = v1 with OB entries only"
        type: choice
        options: [mh, mz, zt, v4, v1, v2, v3, v2_and_v3]
        default: mh

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.pick.outputs.pairs }}
      csv: ${{ steps.pick.outputs.csv }}
      variants: ${{ steps.pick.outputs.variants }}
    steps:
      - name: Pick pair list and variants
        id: pick
        env:
          MODE: ${{ inputs.mode }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          if [ "$MODE" = "full" ]; then
            CSV="eurusd,gbpusd,usdjpy,audusd,usdcad,usdchf,nzdusd,eurjpy,gbpjpy,eurgbp,audjpy,eurchf,eurcad,euraud,eurnzd,gbpchf,gbpcad,gbpaud,gbpnzd,audcad,audchf,audnzd,nzdjpy,nzdcad,nzdchf,cadjpy,cadchf,chfjpy"
          else
            CSV="eurusd"
          fi
          case "$VARIANTS" in
            mh) VJ='["mh"]' ;;
            mz) VJ='["mz"]' ;;
            zt) VJ='["zt"]' ;;
            v1) VJ='["v1"]' ;;
            v2) VJ='["v2"]' ;;
            v3) VJ='["v3"]' ;;
            v4) VJ='["v4"]' ;;
            *)  VJ='["v2","v3"]' ;;
          esac
          echo "csv=$CSV" >> "$GITHUB_OUTPUT"
          echo "pairs=$(echo "$CSV" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"
          echo "variants=$VJ" >> "$GITHUB_OUTPUT"

  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas pyarrow numpy

      - name: Restore processed data ${{ matrix.pair }}
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: histdata-processed-${{ matrix.pair }}-nomatch
          restore-keys: histdata-processed-${{ matrix.pair }}-

      - name: Verify data present ${{ matrix.pair }}
        run: |
          test -f "data/processed/${{ matrix.pair }}_m15.parquet" || { echo "MISSING processed data: ${{ matrix.pair }}_m15.parquet (cache expired? re-run histdata.yml in full mode)"; exit 1; }

      - name: Run cycle ${{ matrix.pair }} ${{ matrix.variant }}
        env:
          PAIR: ${{ matrix.pair }}
          VARIANT: ${{ matrix.variant }}
          LOOKAHEAD_CUTS: "10"
        run: python -m src.research.engine.run_cycle

      - name: Upload cycle output ${{ matrix.pair }} ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ matrix.pair }}-${{ matrix.variant }}
          path: data/phase4_cycle/${{ matrix.pair }}_*
          retention-days: 14
          if-no-files-found: error

  report:
    needs: [plan, simulate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy

      - name: Download pair outputs ${{ matrix.variant }}
        uses: actions/download-artifact@v4
        with:
          pattern: cycle-*-${{ matrix.variant }}
          merge-multiple: true
          path: data/phase4_cycle

      - name: Build report ${{ matrix.variant }}
        env:
          REPORT_LABEL: ${{ inputs.mode }}
          EXPECT_PAIRS: ${{ needs.plan.outputs.csv }}
        run: python -m src.research.engine.report_cycle

      - name: Upload report ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: report-cycle-${{ inputs.mode }}-${{ matrix.variant }}
          path: reports/phase4/report_cycle_*.md
          retention-days: 30
          if-no-files-found: error
