name: Data Download

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode (downloads only 1 month and skips the final Python job)"
        type: boolean
        default: true

jobs:
  download-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [eurusd, gbpusd, usdjpy, audusd, usdcad, usdchf, nzdusd, eurjpy, gbpjpy, eurgbp, audjpy]
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install dukascopy-node

      - name: Restore cache for ${{ matrix.pair }}
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: dukascopy-${{ matrix.pair }}-v3

      - name: Run download script
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          PAIR: ${{ matrix.pair }}
        run: |
          START_TIME=$(date +%s)
          node scripts/download_dukascopy.js
          END_TIME=$(date +%s)
          echo "⏱️ Total seconds for ${{ matrix.pair }}: $((END_TIME - START_TIME))"

      - name: Save cache for ${{ matrix.pair }}
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: dukascopy-${{ matrix.pair }}-v3

  process-data:
    needs: download-pair
    if: ${{ github.event.inputs.test_mode == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas pyarrow

      - name: Restore all caches
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: dukascopy-dummy # Won't hit this, but restores via restore-keys
          restore-keys: |
            dukascopy-

      - name: Run Python resampling and validation
        run: python -m src.data.load_history

      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data validation report [skip ci]"
          git push
