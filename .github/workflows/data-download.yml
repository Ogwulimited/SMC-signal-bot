name: Data Download

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode (downloads only 1 year and skips the final Python job)"
        type: boolean
        default: true

jobs:
  download-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [eurusd, gbpusd, usdjpy, audusd, usdcad, usdchf, nzdusd, eurjpy, gbpjpy, eurgbp, audjpy]
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install dukascopy-node

      # Restore previous runs' data (via prefix) or this run's data (via exact match)
      - name: Restore cache for ${{ matrix.pair }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: dukascopy-${{ matrix.pair }}-v4-${{ github.run_id }}
          restore-keys: |
            dukascopy-${{ matrix.pair }}-v4-

      - name: Run download script
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          PAIR: ${{ matrix.pair }}
        run: |
          START_TIME=$(date +%s)
          node scripts/download_dukascopy.js
          END_TIME=$(date +%s)
          echo "⏱️ Total seconds for ${{ matrix.pair }}: $((END_TIME - START_TIME))"

      # Save using the exact Run ID so process-data can find it precisely
      - name: Save cache for ${{ matrix.pair }}
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/${{ matrix.pair }}
          key: dukascopy-${{ matrix.pair }}-v4-${{ github.run_id }}

  process-data:
    needs: download-pair
    if: ${{ github.event.inputs.test_mode == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas pyarrow

      # Explicitly restore using the EXACT run_id key saved by the matrix jobs
      - name: Restore eurusd
        uses: actions/cache/restore@v4
        with:
          path: data/raw/eurusd
          key: dukascopy-eurusd-v4-${{ github.run_id }}
      - name: Restore gbpusd
        uses: actions/cache/restore@v4
        with:
          path: data/raw/gbpusd
          key: dukascopy-gbpusd-v4-${{ github.run_id }}
      - name: Restore usdjpy
        uses: actions/cache/restore@v4
        with:
          path: data/raw/usdjpy
          key: dukascopy-usdjpy-v4-${{ github.run_id }}
      - name: Restore audusd
        uses: actions/cache/restore@v4
        with:
          path: data/raw/audusd
          key: dukascopy-audusd-v4-${{ github.run_id }}
      - name: Restore usdcad
        uses: actions/cache/restore@v4
        with:
          path: data/raw/usdcad
          key: dukascopy-usdcad-v4-${{ github.run_id }}
      - name: Restore usdchf
        uses: actions/cache/restore@v4
        with:
          path: data/raw/usdchf
          key: dukascopy-usdchf-v4-${{ github.run_id }}
      - name: Restore nzdusd
        uses: actions/cache/restore@v4
        with:
          path: data/raw/nzdusd
          key: dukascopy-nzdusd-v4-${{ github.run_id }}
      - name: Restore eurjpy
        uses: actions/cache/restore@v4
        with:
          path: data/raw/eurjpy
          key: dukascopy-eurjpy-v4-${{ github.run_id }}
      - name: Restore gbpjpy
        uses: actions/cache/restore@v4
        with:
          path: data/raw/gbpjpy
          key: dukascopy-gbpjpy-v4-${{ github.run_id }}
      - name: Restore eurgbp
        uses: actions/cache/restore@v4
        with:
          path: data/raw/eurgbp
          key: dukascopy-eurgbp-v4-${{ github.run_id }}
      - name: Restore audjpy
        uses: actions/cache/restore@v4
        with:
          path: data/raw/audjpy
          key: dukascopy-audjpy-v4-${{ github.run_id }}

      - name: Run Python resampling and validation
        run: python -m src.data.load_history

      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data validation report [skip ci]"
          git push
